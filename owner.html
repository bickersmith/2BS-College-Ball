<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="./styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/cards.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/navbar.css">
  <link rel="stylesheet" href="./styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="./styles/owner.css">
  <script type="module" src="./scripts/owner.js"></script>

  <title>2BS College Ball — Owner</title>
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

<header class="owner-header">
  <h1 id="ownerName" class="page-title"></h1>
</header>


    <!-- OWNER TEAMS -->
    <section class="owner-teams" align="center">
      <div id="ownerTeamListLg" class="owner-team-logos"></div>
    </section>

    <!-- NEXT FIVE GAMES -->
    <section class="owner-next-five">
      <h2 class="section-title">Next Five Games</h2>
      <div id="ownerNextFive" class="schedule-grid"></div>
    </section>

    <!-- FULL SCHEDULE 
    <section class="owner-games">
      <h2 class="section-title">Full Schedule</h2>
      <div id="ownerGamesList" class="schedule-grid"></div>
    </section>
-->
    <!-- FULL TABLE -->
    <section class="owner-table">
      <h2 class="section-title">Full Game Table</h2>
      <table id="ownerGameTable" class="owner-games-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Team</th>
            <th>Opponent</th>
            <th>Venue</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "./scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "./scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "./scripts/footer.js";
    loadFooter();
  </script>

</body>
</html>
