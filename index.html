<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<!-- GLOBAL FOUNDATION -->
<link rel="stylesheet" href="./styles/main.css">

<!-- GLOBAL MODULES -->
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/cards.css">
<link rel="stylesheet" href="./styles/header.css">
<link rel="stylesheet" href="./styles/footer.css">

<!-- PAGE-SPECIFIC -->
<link rel="stylesheet" href="./styles/index.css">

  <title>2BS College Ball — Dashboard</title>
</head>

<body>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

    <!-- OWNERS & TEAMS -->
    <section>
      <div id="owners-grid" class="grid-3"></div>
    </section>

    <!-- NEXT 5 GAMES -->
    <section>
      <h2 class="section-title">Next 5 Games</h2>
      <div id="next-games" class="grid-3"></div>
    </section>

    <section>
      <h2 class="section-title">Draft Recap</h2>
      <div id="draft-recap-grid" class="grid-3"></div>
    </section>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "./scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "./scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "./scripts/footer.js";
    loadFooter();
  </script>

</html>
