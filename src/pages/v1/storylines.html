<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="./styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/cards.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/navbar.css">
  <link rel="stylesheet" href="./styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="./styles/storylines.css">
  <script type="module" src="./scripts/storylines.js"></script>

  <title>Storylines — 2BS College Ball</title>
</head>

<body>

  <div id="header"></div>
  <div id="navbar"></div>

  <div class="page-container">
    <section>
      <div class="storylines-controls">
        <label for="storyline-select">Jump to storyline:</label>
        <select id="storyline-select"></select>
      </div>

      <div id="storylines-container"></div>

      <div class="storylines-pagination">
        <button id="prev-page">Previous</button>
        <span id="page-info"></span>
        <button id="next-page">Next</button>
      </div>
    </section>
  </div>

  <div id="footer"></div>

  <script type="module">
    import { loadHeader } from "./scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "./scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "./scripts/footer.js";
    loadFooter();
  </script>

</body>
</html>
