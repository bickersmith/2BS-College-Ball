<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="./styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/cards.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/navbar.css">
  <link rel="stylesheet" href="./styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="./styles/team.css">
  <script type="module" src="./scripts/team.js"></script>

  <title>2BS College Ball — Team</title>
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

    <!-- TEAM HEADER -->
    <header class="team-header">
      <img id="teamLogo" class="team-header-logo">
      <h1 id="teamName" class="team-header-name"></h1>
      <div id="teamNickname" class="team-header-nickname"></div>
    </header>


    <!-- NEXT FIVE GAMES -->
    <section class="team-next-five">
      <h2 class="section-title">Next Five Games</h2>
      <div id="teamNextFive" class="schedule-grid"></div>
    </section>

    <!-- FULL SCHEDULE 
    <section class="team-schedule">
      <h2 class="team-schedule-title">Full Schedule</h2>
      <div id="teamScheduleGrid" class="team-schedule-grid"></div>
    </section>
-->
    <!-- FULL TABLE -->
    <section class="team-table">
      <h2 class="section-title">Full Game Table</h2>
      <table id="teamGameTable" class="owner-games-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Opponent</th>
            <th>Venue</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "./scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "./scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "./scripts/footer.js";
    loadFooter();
  </script>

</body>
</html>
