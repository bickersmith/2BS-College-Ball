<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="../styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/cards.css">
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="../styles/teams.css">
  <script type="module" src="../scripts/teams.js"></script>

  <title>Teams Directory — 2BS College Ball</title>
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

    <h1 class="page-title">Teams Directory</h1>

    <!-- SEARCH + FILTER -->
    <div class="teams-controls">
      <input id="team-search" type="text" placeholder="Search teams..." class="teams-search-input">
      <select id="conference-filter" class="teams-filter-select">
        <option value="all">All Conferences</option>
      </select>
    </div>

    <!-- TEAMS GRID -->
    <div id="teams-list" class="grid-3"></div>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "../scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "../scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "../scripts/footer.js";
    loadFooter();
  </script>

</body>
</html>
