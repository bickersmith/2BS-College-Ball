<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="../styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/cards.css">
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="../styles/team.css">
  <script type="module" src="../scripts/team.js"></script>

  <title>Team Profile — 2BS College Ball</title>
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

    <!-- TEAM HERO -->
    <div id="team-hero"></div>

    <!-- TEAM DATA -->
    <section>
      <h2 class="section-title">Team Data</h2>
      <div id="team-data" class="team-data-box"></div>
    </section>

    <!-- NEXT 5 GAMES -->
    <section>
      <h2 class="section-title">Next 5 Games</h2>
      <div id="team-next-games" class="grid-3"></div>
    </section>

    <!-- FULL SCHEDULE -->
    <section>
      <h2 class="section-title">Full Schedule</h2>
      <div id="team-full-schedule" class="schedule-table"></div>
    </section>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "../scripts/header.js";
    loadHeader();
  </script>

  <script type="module">
    import { loadNavbar } from "../scripts/navbar.js";
    loadNavbar();
  </script>

  <script type="module">
    import { loadFooter } from "../scripts/footer.js";
    loadFooter();
  </script>

</body>
</html>
