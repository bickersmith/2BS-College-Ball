<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Season 1 Draft</title>

  <!-- GLOBAL FOUNDATION -->
  <link rel="stylesheet" href="./styles/main.css">

  <!-- GLOBAL MODULES -->
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/cards.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/navbar.css">
  <link rel="stylesheet" href="./styles/footer.css">

  <!-- PAGE-SPECIFIC -->
  <link rel="stylesheet" href="./styles/draft.css">
  <script type="module" src="./scripts/draft.js"></script>
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- PAGE CONTENT -->
  <div class="page-container">

    <h1 class="page-title">Season 1 Draft Board</h1>

    <p class="draft-note">
      This page is just the tool we used to run the draft. It doesn’t affect anything now — it simply shows what we tested during the draft.
    </p>

    <div id="draft-status" class="draft-status"></div>

    <div class="draft-controls">
      <button id="btn-randomize">Randomize Owners</button>
      <button id="btn-auto">Auto Draft</button>
      <button id="btn-pick">Pick One</button>
      <button id="btn-clear">Clear Draft</button>
      <button id="btn-lock">Lock</button>
      <button id="btn-unlock">Unlock</button>
    </div>

    <div id="draft-body" class="draft-card-container"></div>

    <h2 class="log-title">Draft Log</h2>
    <div id="draft-log" class="draft-log"></div>

  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- LOADERS -->
  <script type="module">
    import { loadHeader } from "./scripts/header.js";
    import { loadNavbar } from "./scripts/navbar.js";
    import { loadFooter } from "./scripts/footer.js";

    loadHeader();
    loadNavbar();
    loadFooter();
  </script>

</body>
</html>
